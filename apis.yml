name: Element Zero
description: 'Element Zero is a green-materials technology company decarbonizing the production of iron
  and other critical metals. Its patented non-aqueous electrochemical process converts any grade of metal
  ore (iron, nickel, titanium, lithium) into high-purity metal with zero carbon emissions, using 30-40%
  less energy than conventional smelting and operating at low temperatures so it can run on intermittent
  renewable energy (wind, solar, hydro). Based in Perth and northern Western Australia near the world''s
  largest iron-ore ports, the company is scaling a modular platform aimed at the roughly 8% of global CO2
  emissions from iron and steelmaking, including its Pilbara Iron Super Hub at Port Hedland. Backed by a
  US$10M seed round led by Playground Global. This is an industrial deep-tech company with no public API
  or developer platform; the profile carries identity and domain-security signals only.'
